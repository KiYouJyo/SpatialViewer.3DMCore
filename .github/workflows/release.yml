name: 3DMCore Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and package
        shell: pwsh
        run: ./tools/package-kernel.ps1 -Configuration Release -OutputDirectory artifacts/kernel
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = (Get-ChildItem artifacts/kernel/ThreeDmCore-*-x64.zip | Select-Object -First 1).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "SpatialViewer.3DMCore $tag" --generate-notes
          }
          gh release upload $tag $zip --clobber
