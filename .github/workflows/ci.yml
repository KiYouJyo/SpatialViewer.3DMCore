name: 3DMCore CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SpatialViewer.3DMCore.sln
      - run: dotnet build SpatialViewer.3DMCore.sln -c Debug --no-restore
      - run: dotnet build SpatialViewer.3DMCore.sln -c Release --no-restore
      - run: dotnet test SpatialViewer.3DMCore.sln -c Release --no-build --verbosity normal
      - name: Package kernel
        shell: pwsh
        run: ./tools/package-kernel.ps1 -Configuration Release -OutputDirectory artifacts/kernel -SkipBuild
      - name: Validate kernel package
        shell: pwsh
        run: |
          $zip = (Get-ChildItem artifacts/kernel/ThreeDmCore-*-x64.zip | Select-Object -First 1).FullName
          ./tools/validate-kernel-package.ps1 -ArchivePath $zip
      - uses: actions/upload-artifact@v4
        with:
          name: ThreeDmCore-x64
          path: |
            artifacts/kernel/ThreeDmCore-*-x64.zip
            artifacts/kernel/ThreeDmCore-*-x64.zip.sha256
            artifacts/kernel/threedmcore-release.json
